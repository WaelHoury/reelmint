# AI Video Maker - Docker Compose Configuration
# Usage: docker-compose up -d

version: '3.8'

services:
  # PostgreSQL - Persistent storage for users and videos
  postgres:
    image: postgres:16-alpine
    container_name: aivideo-postgres
    environment:
      POSTGRES_USER: aivideo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aivideo_dev}
      POSTGRES_DB: aivideo
    # Ports not exposed to host — accessible only within Docker network.
    # For dev access, use docker-compose.override.yml
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivideo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Session storage and job queue
  redis:
    image: redis:7-alpine
    container_name: aivideo-redis
    # Ports not exposed to host — accessible only within Docker network.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server - FastAPI application
  api:
    build: .
    container_name: aivideo-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+psycopg://aivideo:${POSTGRES_PASSWORD:-aivideo_dev}@postgres:5432/aivideo
      # Reach Ollama running on the host machine (works on macOS, Windows and Linux via extra_hosts)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - TEMP_DIR=/app/temp
      - CACHE_DIR=/app/cache
      - OUTPUT_DIR=/app/output
      - PROJECTS_DIR=/app/projects
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./output:/app/output
      - ./projects:/app/projects
      - ./music:/app/music
      - ./cache:/app/cache
      - ./models:/app/models
    restart: unless-stopped

  # RQ Worker - Background job processor
  # Resource budget: 3 workers × 4 CPUs × 7GB = 12 CPUs, 21GB
  # Leaves ~4 CPUs + 11GB for postgres, redis, api, frontend, OS
  worker:
    build: .
    command: python run_worker.py
    cpus: "4.0"
    mem_limit: "7g"
    deploy:
      replicas: 3
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+psycopg://aivideo:${POSTGRES_PASSWORD:-aivideo_dev}@postgres:5432/aivideo
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - TEMP_DIR=/app/temp
      - CACHE_DIR=/app/cache
      - OUTPUT_DIR=/app/output
      - PROJECTS_DIR=/app/projects
      - ENVIRONMENT=${ENVIRONMENT:-development}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./output:/app/output
      - ./projects:/app/projects
      - ./music:/app/music
      - ./cache:/app/cache
      - ./models:/app/models
    restart: unless-stopped

  # Publish Worker - Social media upload processor (separate from video generation)
  publish-worker:
    build: .
    command: python run_publish_worker.py
    cpus: "1.0"
    mem_limit: "1g"
    deploy:
      replicas: 1
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+psycopg://aivideo:${POSTGRES_PASSWORD:-aivideo_dev}@postgres:5432/aivideo
      - TEMP_DIR=/app/temp
      - CACHE_DIR=/app/cache
      - OUTPUT_DIR=/app/output
      - ENVIRONMENT=${ENVIRONMENT:-development}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./output:/app/output
      - ./cache:/app/cache  # shares the auto-generated social token key with the API
    restart: unless-stopped

  # Frontend - Vue 3 + Element Plus
  frontend:
    image: node:20-alpine
    container_name: aivideo-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
    name: aivideo-postgres-data
  redis_data:
    name: aivideo-redis-data
  frontend_node_modules:
    name: aivideo-frontend-modules
