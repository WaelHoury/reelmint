# AI Video Maker - Docker Compose Configuration
# Usage: docker-compose up -d

version: '3.8'

services:
  # PostgreSQL - Persistent storage for users and videos
  postgres:
    image: postgres:16-alpine
    container_name: aivideo-postgres
    environment:
      POSTGRES_USER: aivideo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aivideo_dev}
      POSTGRES_DB: aivideo
    # Ports not exposed to host — accessible only within Docker network.
    # For dev access, use docker-compose.override.yml
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivideo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Session storage and job queue
  redis:
    image: redis:7-alpine
    container_name: aivideo-redis
    # Ports not exposed to host — accessible only within Docker network.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server - FastAPI application
  api:
    build: .
    container_name: aivideo-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://aivideo:${POSTGRES_PASSWORD:-aivideo_dev}@postgres:5432/aivideo
      # Use host.docker.internal to access Ollama on Windows host
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - TEMP_DIR=/app/temp
      - CACHE_DIR=/app/cache
      - OUTPUT_DIR=/app/output
      - PROJECTS_DIR=/app/projects
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./output:/app/output
      - ./projects:/app/projects
      - ./music:/app/music
      - ./cache:/app/cache
      - ./models:/app/models
    restart: unless-stopped

  # RQ Worker - Background job processor (scaled to 4 replicas)
  worker:
    build: .
    command: python run_worker.py
    deploy:
      replicas: 4
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://aivideo:${POSTGRES_PASSWORD:-aivideo_dev}@postgres:5432/aivideo
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - TEMP_DIR=/app/temp
      - CACHE_DIR=/app/cache
      - OUTPUT_DIR=/app/output
      - PROJECTS_DIR=/app/projects
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./output:/app/output
      - ./projects:/app/projects
      - ./music:/app/music
      - ./cache:/app/cache
      - ./models:/app/models
    restart: unless-stopped

  # Frontend - Vue 3 + Element Plus
  frontend:
    image: node:20-alpine
    container_name: aivideo-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
    name: aivideo-postgres-data
  redis_data:
    name: aivideo-redis-data
  frontend_node_modules:
    name: aivideo-frontend-modules
