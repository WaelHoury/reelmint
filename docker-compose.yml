# Reelmint - Docker Compose Configuration
# Usage: docker-compose up -d

services:
  # PostgreSQL - Persistent storage for users and videos
  postgres:
    image: postgres:16-alpine
    container_name: reelmint-postgres
    environment:
      POSTGRES_USER: reelmint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reelmint_dev}
      POSTGRES_DB: reelmint
    # Ports not exposed to host — accessible only within Docker network.
    # For dev access, use docker-compose.override.yml
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelmint"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Session storage and job queue
  redis:
    image: redis:7-alpine
    container_name: reelmint-redis
    # Ports not exposed to host — accessible only within Docker network.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server - FastAPI application
  api:
    build: .
    container_name: reelmint-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+psycopg://reelmint:${POSTGRES_PASSWORD:-reelmint_dev}@postgres:5432/reelmint
      # Reach Ollama running on the host machine (works on macOS, Windows and Linux via extra_hosts)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - TEMP_DIR=/app/cache/temp
      - CACHE_DIR=/app/cache
      - OUTPUT_DIR=/app/output
      - PROJECTS_DIR=/app/projects
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./output:/app/output
      - ./projects:/app/projects
      - ./music:/app/music
      - ./cache:/app/cache
      - ./models:/app/models
    restart: unless-stopped

  # RQ Worker - Background job processor (renders videos)
  # Resource budget: 2 workers x 2 CPUs x 3 GB = 4 CPUs, 6 GB, which fits
  # Docker Desktop with 8 GB of memory. With more cores/RAM, raise the limits
  # (and FFMPEG_THREADS) or the replica count.
  worker:
    build: .
    command: python run_worker.py
    cpus: "2.0"
    mem_limit: "3g"
    deploy:
      replicas: 2
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+psycopg://reelmint:${POSTGRES_PASSWORD:-reelmint_dev}@postgres:5432/reelmint
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - TEMP_DIR=/app/cache/temp
      - CACHE_DIR=/app/cache
      - OUTPUT_DIR=/app/output
      - PROJECTS_DIR=/app/projects
      - ENVIRONMENT=${ENVIRONMENT:-development}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./output:/app/output
      - ./projects:/app/projects
      - ./music:/app/music
      - ./cache:/app/cache
      - ./models:/app/models
    restart: unless-stopped

  # Publish Worker - Social media upload processor (separate from video generation)
  publish-worker:
    build: .
    command: python run_publish_worker.py
    cpus: "1.0"
    mem_limit: "1g"
    deploy:
      replicas: 1
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+psycopg://reelmint:${POSTGRES_PASSWORD:-reelmint_dev}@postgres:5432/reelmint
      - TEMP_DIR=/app/cache/temp
      - CACHE_DIR=/app/cache
      - OUTPUT_DIR=/app/output
      - ENVIRONMENT=${ENVIRONMENT:-development}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./output:/app/output
      - ./cache:/app/cache  # shares the auto-generated social token key with the API
    restart: unless-stopped

  # Frontend - Vue 3 + Element Plus
  frontend:
    image: node:20-alpine
    container_name: reelmint-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
    name: reelmint-postgres-data
  redis_data:
    name: reelmint-redis-data
  frontend_node_modules:
    name: reelmint-frontend-modules
